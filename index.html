<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Погода: тести й завдання</title>
<style>
:root{--ink:#12263f;--sky:#e3f1fb;--blue:#1f6fb2;--sun:#f4b63a;--ok:#1e9e5a;--okbg:#dcf5e6;--bad:#d64545;--badbg:#fde3e3;--line:#c3d9ea}
*{box-sizing:border-box}
body{margin:0;background:var(--sky);color:var(--ink);font:17px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif}
.w{max-width:760px;margin:0 auto;padding:0 14px}
header{background:var(--ink);color:#fff;padding:26px 0 34px}
header .w{display:flex;align-items:center;gap:16px;justify-content:space-between}
h1{margin:0 0 6px;font-size:1.7rem;line-height:1.2}
header p{margin:0;color:#bcd3e8}
.bar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:2px solid var(--line)}
.bar .w{display:flex;align-items:center;gap:12px;padding-top:9px;padding-bottom:9px}
.track{flex:1;height:10px;background:var(--sky);border-radius:6px;overflow:hidden}
#fill{display:block;height:100%;width:0;background:var(--blue);transition:width .3s}
#stat{font-size:.9rem;white-space:nowrap}
.mod{background:#fff;border:2px solid var(--line);border-radius:20px;padding:20px 18px;margin:20px 0}
.mod h2{margin:0 0 4px;font-size:1.3rem}
.hint{margin:0 0 14px;color:#4a6580;font-size:.95rem}
.q{border:2px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;background:#fbfdff}
.qt{margin:0 0 10px;font-weight:600}
.opts{display:grid;gap:8px}
.opt{font:inherit;text-align:left;background:#fff;color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;align-items:center;gap:10px}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt:disabled{cursor:default;opacity:.6}
.opt.ok:disabled,.opt.bad:disabled{opacity:1}
.ok{background:var(--okbg)!important;border-color:var(--ok)!important}
.bad{background:var(--badbg)!important;border-color:var(--bad)!important}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.n{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--ok);color:#fff;font-weight:700;flex:none}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-bottom:10px}
.row b{min-width:110px}
select{font:inherit;padding:8px;border:2px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);max-width:100%}
.fix{color:var(--bad);font-size:.9rem}
.go{font:inherit;font-weight:700;background:var(--blue);color:#fff;border:0;border-radius:10px;padding:10px 18px;cursor:pointer}
.go:disabled{opacity:.5;cursor:default}
.warn{color:var(--bad);margin:8px 0 0;min-height:1.2em;font-size:.95rem}
.th{display:block;width:150px;max-width:100%;margin:0 auto 10px}
.lab{display:flex;justify-content:space-between;font-size:.85rem;color:#4a6580}
input[type=range]{width:100%;accent-color:var(--blue)}
.note{margin:8px 0 0;font-weight:600;min-height:3em}
#sum{text-align:center;border-color:var(--blue)}
#sum svg{width:110px;height:90px}
.big{font-size:2.4rem;font-weight:800;margin:4px 0}
.sr{display:flex;justify-content:space-between;gap:10px;text-align:left;border-top:1px solid var(--line);padding:8px 0}
.sr i{font-style:normal;font-weight:700}
footer{text-align:center;color:#4a6580;font-size:.85rem;padding:6px 0 30px}

.pic{display:block;max-width:100%;height:auto;margin:0 auto 10px;border-radius:10px;border:1px solid var(--line)}
.pic.s{width:240px}
.mapw{position:relative;margin-bottom:10px}
.mapw img{display:block;width:100%;height:auto;border-radius:10px;border:1px solid var(--line)}
.pin{position:absolute;width:32px;height:32px;transform:translate(-50%,-50%);border-radius:50%;border:3px solid var(--blue);background:rgba(255,255,255,.4);cursor:pointer;padding:0}
.pin:disabled{opacity:1;cursor:default}
.cap{margin:0 0 10px;font-size:.9rem;color:#4a6580;text-align:center}
</style>
</head>
<body>
<header><div class="w">
<div><h1>Метеорологи-дослідники</h1><p>Тести й завдання: температура, вологість, тиск, вітер, опади, прогноз погоди</p></div>

const sh=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]),
pick=(a,n)=>sh(a).slice(0,n),ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function E(t,c,h){const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e}
const app=document.getElementById('app'),fill=document.getElementById('fill'),stat=document.getElementById('stat');
const mods={};let total=0,done=0,score=0;
function mod(id,title,hint){const s=E('section','mod');s.append(E('h2',0,title),E('p','hint',hint));app.append(s);mods[id]={s:0,t:0,title};return s}
function reg(id,n){mods[id].t+=n;total+=n}
function ans(id,ok){done++;if(ok){score++;mods[id].s++}upd()}
function upd(){fill.style.width=(total?done/total*100:0)+'%';stat.textContent='Виконано '+done+' з '+total+'. Бали: '+score;if(total&&done==total)fin()}

function choice(box,id,q,right,opts,extra){
  reg(id,1);
  const c=E('div','q');c.append(E('p','qt',q));if(extra)c.append(extra);
  const g=E('div','opts');
  sh(opts).forEach(o=>{
    const b=E('button','opt',o);
    b.onclick=()=>{
      g.querySelectorAll('button').forEach(x=>{x.disabled=true;if(x.textContent==right)x.classList.add('ok')});
      if(o!=right)b.classList.add('bad');
      ans(id,o==right);
    };
    g.append(b);
  });
  c.append(g);box.append(c);
}


function ordering(box,id,steps){
  reg(id,steps.length);
  let n=0;const bad=[];
  const c=E('div','q');c.append(E('p','qt','Розстав кроки по порядку: натискай на них по черзі.'));
  sh(steps.map((t,i)=>[t,i])).forEach(([t,i])=>{
    const b=E('button','opt',t);b.style.width='100%';b.style.marginBottom='8px';
    b.onclick=()=>{
      if(b.disabled)return;
      if(i==n){b.classList.add('ok');b.innerHTML='<span class="n">'+(n+1)+'</span>'+t;b.disabled=true;ans(id,!bad[n]);n++}
      else{bad[n]=1;b.classList.add('bad');setTimeout(()=>b.classList.remove('bad'),700)}
    };
    c.append(b);
  });
  box.append(c);
}

/* ---------- 1. Прилади ---------- */
(function(){
  const id='dev',box=mod(id,'Прилади-помічники','Підбери до кожного приладу те, що він вимірює або визначає.');
  const pairs=[['Термометр','температуру повітря'],['Гігрометр','вологість повітря'],['Барометр','атмосферний тиск'],['Флюгер','напрям вітру'],['Дощомір','кількість атмосферних опадів']];
  reg(id,pairs.length);
  const opts=sh(pairs),c=E('div','q'),rows=[];
  sh(pairs).forEach(p=>{
    const r=E('div','row');r.append(E('b',0,p[0]));
    const s=E('select');s.append(new Option('— обери —',''));
    opts.forEach(o=>s.append(new Option(o[1],o[1])));
    r.append(s);c.append(r);rows.push([s,p[1],r]);
  });
  const b=E('button','go','Перевірити'),m=E('p','warn');
  b.onclick=()=>{
    if(rows.some(x=>!x[0].value)){m.textContent='Вибери відповідь у кожному рядку.';return}
    m.textContent='';b.disabled=true;
    rows.forEach(([s,right,row])=>{
      s.disabled=true;const ok=s.value==right;s.classList.add(ok?'ok':'bad');

/* ---------- 2. Термометр ---------- */
(function(){
  const id='thm',box=mod(id,'Читаємо термометр','Найменша поділка — один градус. Дивись, де закінчується червоний стовпчик, і не забудь про знак «+» або «–».');
  const f=v=>v>0?'+'+v+' °C':v<0?'\u2212'+(-v)+' °C':'0 °C';
  const lab=v=>v>0?'+'+v:v<0?'\u2212'+(-v):'0';
  const Y=v=>16+(40-v)*3.3;
  function svg(t){
    let s='<svg viewBox="0 0 150 290" class="th" role="img" aria-label="Термометр"><rect x="52" y="8" width="22" height="250" rx="11" fill="#fff" stroke="#12263f" stroke-width="2"/><circle cx="63" cy="270" r="15" fill="#d64545" stroke="#12263f" stroke-width="2"/><rect x="59" y="'+Y(t)+'" width="8" height="'+(268-Y(t))+'" fill="#d64545"/>';
    for(let v=-30;v<=40;v++){
      const L=v%10==0?14:v%5==0?10:6,y=Y(v);
      s+='<line x1="76" x2="'+(76+L)+'" y1="'+y+'" y2="'+y+'" stroke="#12263f" stroke-width="'+(v==0?2.5:1)+'"/>';
      if(v%10==0)s+='<text x="96" y="'+(y+4)+'" font-size="12" fill="#12263f">'+lab(v)+'</text>';
    }
    return s+'</svg>';
  }
  const temps=sh([-ri(2,25),ri(2,32),(Math.random()<.5?-1:1)*ri(1,15)]);
  temps.forEach(t=>{
    const cand=[t,t+1,t-1,t+2,t-2];if(t!=0)cand.push(-t);
    const o=new Set([t]);sh(cand).forEach(x=>{if(o.size<4)o.add(x)});
    const w=E('div');w.innerHTML=svg(t);
    choice(box,id,'Яку температуру повітря показує термометр?',f(t),[...o].map(f),w.firstChild);
  });
})();

/* ---------- 3. Вітер ---------- */

/* ---------- 4. Барометр ---------- */

  '<input type="range" min="0" max="100" value="50" aria-label="Атмосферний тиск"><div class="lab"><span>низький тиск</span><span>високий тиск</span></div><p class="note"></p>';

  const pts=[['Київ',47,25.2],['Львів',11.5,30.5],['Харків',77.2,30.2],['Одеса',47.6,75.3],['Луганськ',95.2,45.3]];

upd();

function icon(k){
  const sun='<circle cx="45" cy="38" r="16" fill="#f4b63a"/><g stroke="#f4b63a" stroke-width="4" stroke-linecap="round"><path d="M45 8v7M15 38h7M68 38h7M24 17l5 5M66 17l-5 5"/></g>';
  const cl='<ellipse cx="58" cy="52" rx="26" ry="14" fill="#9db6cc"/><ellipse cx="40" cy="54" rx="18" ry="11" fill="#9db6cc"/>';
  const rain='<g stroke="#1f6fb2" stroke-width="3" stroke-linecap="round"><path d="M34 74l-3 8M48 74l-3 8M62 74l-3 8M76 74l-3 8"/></g>';
  return '<svg viewBox="0 0 100 90" aria-hidden="true">'+(k==0?sun:k==1?sun+cl:'<g transform="translate(0,-8)">'+cl+'</g>'+rain)+'</svg>';
}
function fin(){
  if(document.getElementById('sum'))return;
  const p=Math.round(score/total*100),k=p>=80?0:p>=50?1:2;
  const T=[['Прогноз: сонячно!','Чудовий результат. Ти добре розумієшся на погоді.'],['Прогноз: мінлива хмарність','Непогано, але є над чим попрацювати. Перечитай параграф і спробуй ще раз.'],['Прогноз: можливий дощ','Цей матеріал варто повторити. Перечитай сторінки підручника й спробуй знову: запитання зміняться.']][k];
  const s=E('section','mod');s.id='sum';
  s.innerHTML=icon(k)+'<h2>'+T[0]+'</h2><div class="big">'+score+' з '+total+'</div><p>Це '+p+' %. '+T[1]+'</p>'+
    Object.values(mods).map(m=>'<div class="sr"><span>'+m.title+'</span><i style="color:'+(m.s==m.t?'var(--ok)':m.s/m.t>=.5?'var(--ink)':'var(--bad)')+'">'+m.s+' з '+m.t+'</i></div>').join('');
  const b=E('button','go','Спробувати ще раз з новими запитаннями');b.style.marginTop='16px';b.onclick=()=>location.reload();
  s.append(b);app.append(s);
  setTimeout(()=>s.scrollIntoView({behavior:'smooth',block:'start'}),400);
}
